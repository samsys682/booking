<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="booking 预约上门服务系统">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <clipPath id="card"><rect x="812" y="150" width="356" height="340" rx="20"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- 细网格点缀 -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
  </g>

  <!-- 左侧文字 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">
    <rect x="80" y="96" width="214" height="34" rx="17" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="104" y="119" font-size="16" letter-spacing="2" fill="#4ade80">开源版 · OPEN SOURCE</text>

    <text x="78" y="230" font-size="88" font-weight="800" fill="#f8fafc" letter-spacing="1">booking</text>
    <text x="84" y="286" font-size="38" font-weight="600" fill="#cbd5e1">预约上门服务系统</text>

    <line x1="84" y1="322" x2="150" y2="322" stroke="#22c55e" stroke-width="4"/>

    <text x="84" y="372" font-size="26" fill="#94a3b8">下单 · 派单 · 上门打卡 · 收款评价 完整闭环</text>
    <text x="84" y="410" font-size="20" fill="#64748b">管理后台 / 顾客端 / 技师端 / 微信小程序 四端一体</text>

    <!-- 技术栈标签 -->
    <g font-size="18" fill="#e2e8f0">
      <rect x="84" y="452" width="150" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="159" y="479" text-anchor="middle">ThinkPHP 8</text>
      <rect x="248" y="452" width="110" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="303" y="479" text-anchor="middle">Vue 3</text>
      <rect x="372" y="452" width="118" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="431" y="479" text-anchor="middle">uni-app</text>
      <rect x="504" y="452" width="110" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="559" y="479" text-anchor="middle">MySQL</text>
    </g>
  </g>

  <!-- 右侧抽象预约卡片 -->
  <g>
    <rect x="812" y="150" width="356" height="340" rx="20" fill="#0b1220" stroke="#243247"/>
    <g clip-path="url(#card)">
      <rect x="812" y="150" width="356" height="70" fill="#16233b"/>
    </g>
    <text x="840" y="192" font-family="'Microsoft YaHei',system-ui,sans-serif" font-size="20" fill="#e2e8f0">今日预约</text>
    <circle cx="1136" cy="185" r="6" fill="#22c55e"/>

    <!-- 列表项 -->
    <g font-family="'Microsoft YaHei',system-ui,sans-serif" font-size="15">
      <rect x="836" y="240" width="308" height="52" rx="10" fill="#111d33" stroke="#22304a"/>
      <circle cx="864" cy="266" r="12" fill="#22c55e" fill-opacity="0.85"/>
      <text x="888" y="262" fill="#cbd5e1">上门按摩理疗 · 张技师</text>
      <text x="888" y="281" fill="#5b6b85">14:00 – 15:30 · 服务中</text>

      <rect x="836" y="304" width="308" height="52" rx="10" fill="#111d33" stroke="#22304a"/>
      <circle cx="864" cy="330" r="12" fill="#3b82f6" fill-opacity="0.85"/>
      <text x="888" y="326" fill="#cbd5e1">家政深度保洁 · 李技师</text>
      <text x="888" y="345" fill="#5b6b85">16:00 – 18:00 · 待派单</text>

      <rect x="836" y="368" width="308" height="52" rx="10" fill="#111d33" stroke="#22304a"/>
      <circle cx="864" cy="394" r="12" fill="#f59e0b" fill-opacity="0.85"/>
      <text x="888" y="390" fill="#cbd5e1">设备维修安装 · 王技师</text>
      <text x="888" y="409" fill="#5b6b85">已完成 · 好评 5.0</text>
    </g>

    <rect x="836" y="436" width="308" height="34" rx="8" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.4"/>
    <text x="990" y="458" text-anchor="middle" font-family="'Microsoft YaHei',system-ui,sans-serif" font-size="15" fill="#4ade80">+ 新建预约</text>
  </g>
</svg>
